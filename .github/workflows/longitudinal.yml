name: Empirical longitudinal component
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  longitudinal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps .
      - run: python -m pytest -q
      - run: python scripts/run_release_calibration.py --out outputs/longitudinal_releases
      - run: python scripts/verify_release_calibration.py outputs/longitudinal_releases
      - run: python scripts/run_empirical_longitudinal.py --out outputs/longitudinal_empirical
      - run: python scripts/verify_empirical_longitudinal.py outputs/longitudinal_empirical
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: empirical-longitudinal-results
          path: outputs/
          if-no-files-found: warn
