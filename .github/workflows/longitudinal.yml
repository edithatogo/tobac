name: Empirical longitudinal component
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  longitudinal:
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.15.1'
      - name: Select repository-local Python 3.15.1
        run: |
          python -m venv .venv-ci
          .venv-ci/bin/python -c "import sys; print(sys.executable, sys.version); assert sys.version_info[:3] == (3, 15, 1)"
          echo "$GITHUB_WORKSPACE/.venv-ci/bin" >> "$GITHUB_PATH"
      - name: Inventory preserved evidence bytes and prior-work provenance
        run: python scripts/qualify_integrations.py --mode inventory --out outputs/evidence-longitudinal.json
      - run: .venv-ci/bin/python scripts/run_bounded.py --timeout 2400 -- .venv-ci/bin/python -m pip install -r requirements.lock
      - run: .venv-ci/bin/python scripts/run_bounded.py --timeout 2400 -- .venv-ci/bin/python -m pip install --no-deps .
      - run: .venv-ci/bin/python scripts/run_bounded.py --timeout 2400 -- .venv-ci/bin/python -m pytest -q
      - run: .venv-ci/bin/python scripts/run_bounded.py --timeout 2400 -- .venv-ci/bin/python scripts/run_release_calibration.py --out outputs/longitudinal_releases
      - run: python scripts/verify_release_calibration.py outputs/longitudinal_releases
      - run: .venv-ci/bin/python scripts/run_bounded.py --timeout 2400 -- .venv-ci/bin/python scripts/run_empirical_longitudinal.py --out outputs/longitudinal_empirical
      - run: python scripts/verify_empirical_longitudinal.py outputs/longitudinal_empirical
      - name: Compare regenerated tables with the checked-in results
        run: python scripts/check_longitudinal_results.py --empirical outputs/longitudinal_empirical --releases outputs/longitudinal_releases
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: empirical-longitudinal-results
          path: outputs/
          if-no-files-found: warn
