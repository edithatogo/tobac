name: Regulatory uncertainty milestone
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: regulatory-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  numerical:
    name: numerical
    runs-on: macos-latest
    timeout-minutes: 40
    env:
      OPENBLAS_NUM_THREADS: '1'
      POLARS_MAX_THREADS: '2'
      RAYON_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.15.2'
      - name: Select repository-local Python 3.15.1
        run: |
          python -m venv .venv-ci
          .venv-ci/bin/python -c "import sys; print(sys.executable, sys.version); assert sys.version_info[:3] == (3, 15, 1)"
          echo "$GITHUB_WORKSPACE/.venv-ci/bin" >> "$GITHUB_PATH"
      - name: Verify integrated evidence and historical provenance
        run: python scripts/qualify_integrations.py --mode inventory --out outputs/evidence-ci.json
      - run: .venv-ci/bin/python scripts/run_bounded.py --timeout 2400 -- .venv-ci/bin/python -m pip install -r requirements.lock
      - run: .venv-ci/bin/python scripts/run_bounded.py --timeout 2400 -- .venv-ci/bin/python -m pip install --no-deps .
      - run: .venv-ci/bin/python scripts/run_bounded.py --timeout 2400 -- .venv-ci/bin/python -m pytest -q
      - run: python scripts/verify.py
      - run: OPENBLAS_NUM_THREADS=1 .venv-ci/bin/python scripts/run_bounded.py --timeout 2400 -- .venv-ci/bin/python -m tobac.run --out outputs/ci_full
      - run: python scripts/verify.py outputs/ci_full
      - run: OPENBLAS_NUM_THREADS=1 .venv-ci/bin/python scripts/run_bounded.py --timeout 2400 -- .venv-ci/bin/python -m tobac.m2 --out outputs/ci_m2 --grid-check
      - run: python scripts/verify.py outputs/ci_m2
      - name: Install checksum-pinned export scanner
        if: always()
        run: sh scripts/install_security_tools.sh
      - name: Stage inspected public artifact files
        if: always()
        run: .venv-ci/bin/python scripts/run_bounded.py --max-rss-mib 4096 --timeout 2400 -- .venv-ci/bin/python scripts/publication_boundary.py export --source outputs --destination artifact-exports/ci-1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success()
        with:
          name: exact-regulatory-results
          path: artifact-exports/ci-1/
  sourceright:
    name: sourceright
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.15.2'
      - name: Select repository-local Python 3.15.1
        run: |
          python -m venv .venv-ci
          .venv-ci/bin/python -c "import sys; print(sys.executable, sys.version); assert sys.version_info[:3] == (3, 15, 1)"
          echo "$GITHUB_WORKSPACE/.venv-ci/bin" >> "$GITHUB_PATH"
      # The upstream asset name says x86_64; verified Mach-O bytes are ARM64.
      - name: Fetch and verify pinned release
        run: |
          curl --fail --location --retry 2 https://github.com/edithatogo/sourceright/releases/download/v0.1.20/sourceright-macos-x86_64 -o /tmp/sourceright
          echo 'b405f4a4dc09ad8af03bfd49a84484df194aac8401a188a08510334a8aa77a5c  /tmp/sourceright' | shasum -a 256 -c -
          chmod +x /tmp/sourceright
      - run: PATH="/tmp:$PATH" .venv-ci/bin/python scripts/run_bounded.py --timeout 2400 -- .venv-ci/bin/python scripts/qualify_integrations.py --mode sourceright --all-csl --out outputs/sourceright.json
      - name: Install checksum-pinned export scanner
        if: always()
        run: sh scripts/install_security_tools.sh
      - name: Stage inspected public artifact files
        if: always()
        run: .venv-ci/bin/python scripts/run_bounded.py --max-rss-mib 4096 --timeout 2400 -- .venv-ci/bin/python scripts/publication_boundary.py export --source outputs --destination artifact-exports/ci-2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success()
        with:
          name: sourceright-receipt
          path: artifact-exports/ci-2/
  voiage-parity:
    name: voiage-parity
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.6'
          python-version: '3.15.1'
          enable-cache: false
      - name: Select repository-local Python 3.15.1
        run: |
          uv venv --python 3.15.1 .venv-ci
          .venv-ci/bin/python -c "import sys; print(sys.executable, sys.version); assert sys.version_info[:3] == (3, 15, 1)"
      - name: Build and qualify pinned Voiage Python 3.15.1 compatibility candidate
        run: .venv-ci/bin/python scripts/run_bounded.py --timeout 2400 -- uvx --python 3.15.1 --from nox==2026.10.20 nox -s voiage
      - name: Install checksum-pinned export scanner
        if: always()
        run: sh scripts/install_security_tools.sh
      - name: Stage inspected public artifact files
        if: always()
        run: .venv-ci/bin/python scripts/run_bounded.py --max-rss-mib 4096 --timeout 2400 -- .venv-ci/bin/python scripts/publication_boundary.py export --source outputs --destination artifact-exports/ci-3
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: success()
        with:
          name: voiage-parity-receipt
          path: artifact-exports/ci-3/
          if-no-files-found: warn
          retention-days: 14
