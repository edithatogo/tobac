name: Regulatory uncertainty milestone
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  numerical:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.15'
      - name: Verify integrated evidence and historical provenance
        run: python scripts/qualify_integrations.py --mode inventory --out outputs/evidence-ci.json
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps .
      - run: python -m pytest -q
      - run: python scripts/verify.py
      - run: OPENBLAS_NUM_THREADS=1 python -m tobac.run --out outputs/ci_full
      - run: python scripts/verify.py outputs/ci_full
      - run: OPENBLAS_NUM_THREADS=1 python -m tobac.m2 --out outputs/ci_m2 --grid-check
      - run: python scripts/verify.py outputs/ci_m2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: exact-regulatory-results
          path: outputs/
  sourceright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.15'
      - name: Fetch and verify pinned release
        run: |
          curl --fail --location --retry 2 https://github.com/edithatogo/sourceright/releases/download/v0.1.20/sourceright-linux-x86_64 -o /tmp/sourceright
          echo '9c4379be86a96cc8dc266b4011a6f8fcee3cd00b1e9720a87981ed31e9e5bc36  /tmp/sourceright' | sha256sum -c -
          chmod +x /tmp/sourceright
      - run: PATH="/tmp:$PATH" python scripts/qualify_integrations.py --mode sourceright --all-csl --out outputs/sourceright.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sourceright-receipt
          path: outputs/
  voiage-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.15'
      - run: python -m pip install voiage==2.1.0
      - run: python scripts/qualify_integrations.py --mode voiage --out outputs/voiage.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: voiage-parity-receipt
          path: outputs/
