name: Reviewable dependency-lock candidates
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dependency-lock-${{ github.ref }}
  cancel-in-progress: false
jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        profile: [runtime, audit, voiage, ecosystem]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.5'
          python-version: '3.15.1'
          enable-cache: false
      - name: Resolve from real package metadata
        env:
          LOCK_PROFILE: ${{ matrix.profile }}
        run: |
          python -c "import sys; assert sys.version_info[:3] == (3, 15, 1); print(sys.version)"
          python scripts/lock_receipt.py generate --profile "$LOCK_PROFILE" --path outputs/engineering/lock-candidate
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: success()
        with:
          name: dependency-lock-candidate-${{ matrix.profile }}
          path: outputs/engineering/lock-candidate/
          if-no-files-found: error
          retention-days: 14
