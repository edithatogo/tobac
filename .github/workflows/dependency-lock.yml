name: Reviewable dependency-lock candidates
'on':
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact 40-character source commit (release must be current main)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: dependency-lock-${{ github.ref }}
  cancel-in-progress: false
jobs:
  resolve:
    name: Resolve and install ${{ matrix.profile }} candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        profile:
        - runtime
        - audit
        - voiage
        - ecosystem
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: 'false'
    - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
      with:
        version: 0.13.7
        python-version: 3.15.2
        enable-cache: 'false'
    - name: Require the requested immutable source
      env:
        EXPECTED_SHA: ${{ inputs.expected_sha }}
      run: |-
        test "$EXPECTED_SHA" != ""
        test "${#EXPECTED_SHA}" = 40
        test "$GITHUB_SHA" = "$EXPECTED_SHA"
        test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
    - name: Resolve from real package metadata
      run: |-
        uv venv --python 3.15.2 .venv-lock
        .venv-lock/bin/python -c "import sys; print(sys.executable, sys.version); assert sys.version_info[:3] == (3, 15, 2)"
        .venv-lock/bin/python scripts/run_bounded.py --max-rss-mib 4096 --timeout 900 -- .venv-lock/bin/python scripts/lock_receipt.py generate --profile "$LOCK_PROFILE" --path outputs/engineering/lock-candidate
    - name: Verify and hash-install the generated candidate in an isolated environment
      run: |-
        case "$LOCK_PROFILE" in
          runtime) LOCK_NAME=requirements ;;
          audit|voiage|ecosystem) LOCK_NAME="$LOCK_PROFILE" ;;
          *) exit 1 ;;
        esac
        echo "LOCK_NAME=$LOCK_NAME" >> "$GITHUB_ENV"
        .venv-lock/bin/python scripts/lock_receipt.py verify --profile "$LOCK_PROFILE" --path "outputs/engineering/lock-candidate/$LOCK_NAME.lock"
        uv venv --python 3.15.2 .venv-candidate
        .venv-candidate/bin/python -c "import sys; print(sys.executable, sys.version); assert sys.version_info[:3] == (3, 15, 2)"
        .venv-lock/bin/python scripts/run_bounded.py --max-rss-mib 4096 --timeout 1800 -- uv pip sync --python .venv-candidate/bin/python --require-hashes "outputs/engineering/lock-candidate/$LOCK_NAME.lock"
        uv pip check --python .venv-candidate/bin/python
        uv pip freeze --python .venv-candidate/bin/python > outputs/engineering/installed.txt
        .venv-lock/bin/python scripts/lock_receipt.py verify --profile "$LOCK_PROFILE" --path "outputs/engineering/lock-candidate/$LOCK_NAME.lock"
    - name: Package exact reviewable locks, receipts and installed inventory
      run: |-
        mkdir -p outputs/review
        .venv-lock/bin/python - <<'PYTHON'
        import hashlib,json,os,tarfile
        from pathlib import Path
        name=os.environ["LOCK_NAME"]
        base=Path("outputs/engineering/lock-candidate")
        files=[base/(name+".lock"),base/(name+".lock.json"),Path("outputs/engineering/installed.txt")]
        report={"source_sha":os.environ["GITHUB_SHA"],"profile":os.environ["LOCK_PROFILE"],"python":"3.15.2","platform":"linux-x86_64","installed_with_hashes":True,"dependency_check":"passed","files":{p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in files}}
        Path("outputs/review/qualification.json").write_text(json.dumps(report,sort_keys=True,indent=2)+"\n")
        with tarfile.open("outputs/review/lock-candidate.tar.gz","w:gz") as archive:
            for path in files:
                archive.add(path,arcname=path.name)
        PYTHON
    - name: Install checksum-pinned export scanners
      if: always()
      run: sh scripts/install_security_tools.sh
    - name: Inspect candidate export
      run: .venv-lock/bin/python scripts/publication_boundary.py export --source outputs/review --destination artifact-exports/lock-candidate
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: success()
      with:
        name: dependency-lock-candidate-${{ matrix.profile }}
        path: artifact-exports/lock-candidate/
        if-no-files-found: error
        retention-days: '14'
    env:
      LOCK_PROFILE: ${{ matrix.profile }}
      PYTHONUTF8: '1'
