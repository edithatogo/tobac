name: Publication and source security
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publication-security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  boundary:
    name: Public boundary and secret scanning
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          version: '0.13.5'
          python-version: '3.15.1'
          enable-cache: false
      - name: Select repository-local interpreter
        run: |
          uv venv --python 3.15.1 .venv-ci
          .venv-ci/bin/python -c 'import sys; assert sys.version_info[:3] == (3, 15, 1)'
      - run: sh scripts/install_security_tools.sh
      - run: .venv-ci/bin/python scripts/run_bounded.py --max-rss-mib 4096 --timeout 2400 -- uvx --python 3.15.1 --from nox==2026.10.20 nox -s publication
  codeql:
    name: CodeQL Python and Actions
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # Upload CodeQL Python and Actions analysis results.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
        with:
          languages: python,actions
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
