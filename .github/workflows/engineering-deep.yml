name: Deep engineering audits
on:
  schedule:
    - cron: '17 19 * * 5'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deep-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    name: audit
    strategy:
      fail-fast: false
      matrix:
        session: [security, strict_all, mutation, profile]
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.6'
          python-version: '3.15.1'
          enable-cache: false
      - name: Select repository-local Python 3.15.1
        run: |
          uv venv --python 3.15.1 .venv-ci
          .venv-ci/bin/python -c "import sys; print(sys.executable, sys.version); assert sys.version_info[:3] == (3, 15, 1)"
      - run: mkdir -p outputs/engineering
      - name: Run selected bounded audit
        env:
          NOX_SESSION: ${{ matrix.session }}
        run: .venv-ci/bin/python scripts/run_bounded.py --timeout 2400 -- uvx --python 3.15.1 --from nox==2026.10.20 nox --report outputs/engineering/nox-report.json -s "$NOX_SESSION"
      - name: Install checksum-pinned export scanner
        if: always()
        run: sh scripts/install_security_tools.sh
      - name: Stage inspected public artifact files
        if: always()
        run: .venv-ci/bin/python scripts/run_bounded.py --max-rss-mib 4096 --timeout 2400 -- .venv-ci/bin/python scripts/publication_boundary.py export --source outputs --destination artifact-exports/engineering-deep-1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: success()
        with:
          name: deep-${{ matrix.session }}
          path: artifact-exports/engineering-deep-1/
          if-no-files-found: warn
          retention-days: 14
  canary:
    name: Python 3.15.1 ecosystem canary (not release qualification)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.6'
          python-version: '3.15.1'
          enable-cache: false
      - name: Select repository-local Python 3.15.1
        run: |
          uv venv --python 3.15.1 .venv-ci
          .venv-ci/bin/python -c "import sys; print(sys.executable, sys.version); assert sys.version_info[:3] == (3, 15, 1)"
      - run: mkdir -p outputs/engineering
      - run: .venv-ci/bin/python scripts/run_bounded.py --timeout 2400 -- uvx --python 3.15.1 --from nox==2026.10.20 nox --report outputs/engineering/nox-report.json -s canary
      - name: Install checksum-pinned export scanner
        if: always()
        run: sh scripts/install_security_tools.sh
      - name: Stage inspected public artifact files
        if: always()
        run: .venv-ci/bin/python scripts/run_bounded.py --max-rss-mib 4096 --timeout 2400 -- .venv-ci/bin/python scripts/publication_boundary.py export --source outputs --destination artifact-exports/engineering-deep-2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: success()
        with:
          name: compatibility-canary-evidence
          path: artifact-exports/engineering-deep-2/
          if-no-files-found: warn
          retention-days: 14
