name: Deep engineering audits
on:
  schedule:
    - cron: '17 19 * * 5'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deep-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    strategy:
      fail-fast: false
      matrix:
        session: [security, strict_all, mutation, profile, lock]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.13.5'
          python-version: '3.13'
          enable-cache: false
      - name: Run selected bounded audit
        env:
          NOX_SESSION: ${{ matrix.session }}
        run: uvx --from nox==2026.10.20 nox -s "$NOX_SESSION"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: deep-${{ matrix.session }}
          path: |
            outputs/
            engineering/requirements.lock
          if-no-files-found: warn
          retention-days: 14

  canary:
    name: Python 3.15 ecosystem canary (not reference qualification)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.13.5'
          python-version: '3.15'
          enable-cache: false
      - run: uvx --from nox==2026.10.20 nox -s canary
