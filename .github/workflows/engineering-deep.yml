name: Deep engineering audits
on:
  schedule:
    - cron: '17 19 * * 5'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deep-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    strategy:
      fail-fast: false
      matrix:
        session: [security, strict_all, mutation, profile, lock]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.13.5'
          python-version: '3.13'
          enable-cache: false
      - run: mkdir -p outputs/engineering
      - name: Run selected bounded audit
        env:
          NOX_SESSION: ${{ matrix.session }}
        run: uvx --python 3.13 --from nox==2026.10.20 nox --report outputs/engineering/nox-report.json -s "$NOX_SESSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: deep-${{ matrix.session }}
          path: outputs/
          if-no-files-found: warn
          retention-days: 14
  canary:
    name: Python 3.15 ecosystem canary (not reference qualification)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.13.5'
          python-version: '3.15'
          enable-cache: false
      - run: mkdir -p outputs/engineering
      - run: uvx --python 3.15 --from nox==2026.10.20 nox --report outputs/engineering/nox-report.json -s canary
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: compatibility-canary-evidence
          path: outputs/engineering/
          if-no-files-found: warn
          retention-days: 14
