name: M3 research methods
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: m3-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  numerical:
    name: numerical
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.5'
          python-version: '3.15.1'
          enable-cache: false
      - name: Select repository-local Python 3.15.1
        run: |
          uv venv --python 3.15.1 .venv-ci
          .venv-ci/bin/python -c "import sys; print(sys.executable, sys.version); assert sys.version_info[:3] == (3, 15, 1)"
      - run: .venv-ci/bin/python scripts/run_bounded.py --timeout 2400 -- uvx --python 3.15.1 --from nox==2026.10.20 nox -s research_m3
      - run: .nox/research_m3/bin/python scripts/unpack_m3_results.py --out outputs/saved_m3
      - name: Install checksum-pinned export scanner
        if: always()
        run: sh scripts/install_security_tools.sh
      - name: Stage inspected public artifact files
        if: always()
        run: .venv-ci/bin/python scripts/run_bounded.py --max-rss-mib 4096 --timeout 2400 -- .venv-ci/bin/python scripts/publication_boundary.py export --source outputs --destination artifact-exports/research-m3-1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: success()
        with:
          name: m3-numerical-receipts
          path: artifact-exports/research-m3-1/
          if-no-files-found: warn
          retention-days: 14
  voiage-released-parity:
    name: voiage-released-parity
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.5'
          python-version: '3.15.1'
          enable-cache: false
      - name: Select repository-local Python 3.15.1
        run: |
          uv venv --python 3.15.1 .venv-ci
          .venv-ci/bin/python -c "import sys; print(sys.executable, sys.version); assert sys.version_info[:3] == (3, 15, 1)"
      - name: Build and qualify pinned Voiage Python 3.15.1 compatibility candidate
        run: .venv-ci/bin/python scripts/run_bounded.py --timeout 2400 -- uvx --python 3.15.1 --from nox==2026.10.20 nox -s voiage
      - name: Install checksum-pinned export scanner
        if: always()
        run: sh scripts/install_security_tools.sh
      - name: Stage inspected public artifact files
        if: always()
        run: .venv-ci/bin/python scripts/run_bounded.py --max-rss-mib 4096 --timeout 2400 -- .venv-ci/bin/python scripts/publication_boundary.py export --source outputs --destination artifact-exports/research-m3-2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: success()
        with:
          name: m3-actual-voiage-parity
          path: artifact-exports/research-m3-2/
          if-no-files-found: warn
          retention-days: 14
