name: M3 research methods
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: m3-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  numerical:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.5'
          python-version: '3.15.1'
          enable-cache: false
      - run: uvx --python 3.15.1 --from nox==2026.10.20 nox -s research_m3
      - run: python scripts/unpack_m3_results.py --out outputs/saved_m3
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: m3-numerical-receipts
          path: outputs/
          if-no-files-found: warn
          retention-days: 14
  voiage-released-parity:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.5'
          python-version: '3.15.1'
          enable-cache: false
      - name: Build and qualify pinned Voiage Python 3.15.1 compatibility candidate
        run: uvx --python 3.15.1 --from nox==2026.10.20 nox -s voiage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: m3-actual-voiage-parity
          path: outputs/engineering/voiage-receipts-*/
          if-no-files-found: warn
          retention-days: 14
