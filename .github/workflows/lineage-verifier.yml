name: Hosted lineage verifier qualification
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lineage-verifier-${{ github.ref }}
  cancel-in-progress: true
jobs:
  runtime:
    name: Verifier ${{ matrix.os }} ${{ matrix.installer }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-latest, installer: uv}
          - {os: macos-latest, installer: setup-python}
          - {os: ubuntu-latest, installer: uv}
          - {os: windows-latest, installer: uv}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        if: matrix.installer == 'uv'
        with:
          version: '0.13.5'
          python-version: '3.15.1'
          enable-cache: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        if: matrix.installer == 'setup-python'
        with:
          python-version: '3.15.1'
      - name: Select repo-local Python 3.15.1
        run: |
          python -m venv .venv-lineage
          if [ "$RUNNER_OS" = Windows ]; then
            echo "LINEAGE_PYTHON=$GITHUB_WORKSPACE/.venv-lineage/Scripts/python.exe" >> "$GITHUB_ENV"
          else
            echo "LINEAGE_PYTHON=$GITHUB_WORKSPACE/.venv-lineage/bin/python" >> "$GITHUB_ENV"
          fi
      - name: Qualify the actual verifier and signature controls
        run: '"$LINEAGE_PYTHON" scripts/hosted_lineage.py --probe'
