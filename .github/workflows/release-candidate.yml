name: Internal release candidate
'on':
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact 40-character source commit (release must be current main)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: false
jobs:
  qualify:
    name: Qualify internal release candidate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TOBAC_REQUIRE_LOCK: '1'
      OPENBLAS_NUM_THREADS: '1'
      POLARS_MAX_THREADS: '2'
      RAYON_NUM_THREADS: '2'
      PYTHONUTF8: '1'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: 'false'
    - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
      with:
        version: 0.13.5
        python-version: 3.15.1
        enable-cache: 'false'
    - name: Require the requested immutable source
      env:
        EXPECTED_SHA: ${{ inputs.expected_sha }}
      run: |-
        test "$EXPECTED_SHA" != ""
        test "${#EXPECTED_SHA}" = 40
        test "$GITHUB_SHA" = "$EXPECTED_SHA"
        test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
    - name: Select repository-local interpreter
      run: |-
        uv venv --python 3.15.1 .venv-ci
        .venv-ci/bin/python -c "import sys; print(sys.executable, sys.version); assert sys.version_info[:3] == (3, 15, 1)"
    - name: Require source-bound locks and native lineage before execution
      run: |-
        git ls-files --error-unmatch engineering/requirements.lock engineering/requirements.lock.json engineering/audit.lock engineering/audit.lock.json
        .venv-ci/bin/python scripts/lock_receipt.py verify --profile runtime --path engineering/requirements.lock
        .venv-ci/bin/python scripts/lock_receipt.py verify --profile audit --path engineering/audit.lock
        .venv-ci/bin/python -I -S scripts/hosted_lineage.py --configure
    - name: Fix build timestamp
      run: |-
        echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
        mkdir -p outputs/engineering
    - name: Qualify locked internal candidate
      run: .venv-ci/bin/python scripts/run_bounded.py --max-rss-mib 4096 --timeout 2400 -- uvx --python 3.15.1 --from nox==2026.10.20 nox --report outputs/engineering/nox-report.json -s tests quality strict_all
        security reproduce package clean_package
    - name: Compare all eight accepted scientific variants
      run: |-
        replay=(.venv-ci/bin/python scripts/run_bounded.py --max-rss-mib 4096 --timeout 300 -- .nox/reproduce/bin/python)
        "${replay[@]}" scripts/run_m2_publication.py --out outputs/engineering/reproduction-no-grid
        "${replay[@]}" scripts/verify.py outputs/engineering/reproduction-no-grid
        "${replay[@]}" scripts/check_scientific_reproduction.py --replays outputs/engineering/replays --no-grid outputs/engineering/reproduction-no-grid --out outputs/engineering/scientific-reproduction.json
    - name: Reject a candidate superseded on main
      env:
        EXPECTED_SHA: ${{ inputs.expected_sha }}
      run: test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_SHA"
    - name: Install checksum-pinned export scanners
      if: always()
      run: sh scripts/install_security_tools.sh
    - name: Inspect qualification evidence
      id: evidence
      if: always()
      run: .venv-ci/bin/python scripts/publication_boundary.py export --source outputs --destination artifact-exports/evidence
    - name: Preserve inspected evidence even on qualification failure
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always() && steps.evidence.outcome == 'success'
      with:
        name: release-qualification-evidence
        path: artifact-exports/evidence/
        if-no-files-found: error
        retention-days: '14'
    - name: Inspect successful internal package
      run: .venv-ci/bin/python scripts/publication_boundary.py export --source outputs/release-candidate --destination artifact-exports/package
    - name: Successful internal package only
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: success()
      with:
        name: internal-release-candidate
        path: artifact-exports/package/
        if-no-files-found: error
        retention-days: '30'
