name: Internal release candidate
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: false
jobs:
  qualify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TOBAC_REQUIRE_LOCK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.13.5'
          python-version: '3.13'
          enable-cache: false
      - name: Require committed source-bound dependency locks
        run: |
          git ls-files --error-unmatch engineering/requirements.lock engineering/requirements.lock.json engineering/audit.lock engineering/audit.lock.json
          python scripts/lock_receipt.py verify --profile runtime --path engineering/requirements.lock
          python scripts/lock_receipt.py verify --profile audit --path engineering/audit.lock
      - name: Fix build timestamp and create receipt directory
        run: |
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
          mkdir -p outputs/engineering
      - name: Qualify locked candidate
        run: uvx --python 3.13 --from nox==2026.10.20 nox --report outputs/engineering/nox-report.json -s tests quality strict_all security reproduce package
      - name: Preserve qualification evidence even on failure
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: release-qualification-evidence
          path: outputs/
          if-no-files-found: warn
          retention-days: 14
      - name: Successful internal package only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: success()
        with:
          name: internal-release-candidate
          path: outputs/release-candidate/
          if-no-files-found: error
          retention-days: 30
