name: OpenSSF Scorecard

on:
  branch_protection_rule:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '27 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write # Upload the SARIF analysis to code scanning.
      id-token: write # Authenticate publication of public Scorecard results.
      actions: read # Inspect workflow and run settings for the assessment.
    steps:
      - name: Checkout repository for SARIF provenance
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: >-
            ${{ github.event.repository.visibility == 'public'
              && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
              && (github.event_name == 'push' || github.event_name == 'schedule'
                || github.event_name == 'branch_protection_rule'
                || github.event_name == 'workflow_dispatch') }}
      - name: Retain the Scorecard SARIF report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif-${{ github.run_id }}
          path: results.sarif
          retention-days: 30
          if-no-files-found: error
      - name: Upload Scorecard SARIF
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
        with:
          sarif_file: results.sarif
