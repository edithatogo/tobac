[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
[project]
name = "tobac-regulatory-research"
version = "0.2.0"
requires-python = ">=3.15.1,<3.16"
dependencies = ["numpy==2.5.4", "scipy==1.18.1"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[project.optional-dependencies]
longitudinal = ["pandas==3.0.6", "matplotlib==3.11.2"]
engineering = ["jsonschema==4.26.0"]

[tool.mutmut]
source_paths = ["src/"]
only_mutate = ["src/tobac/supply.py"]
pytest_add_cli_args_test_selection = ["tests/test_workstream_integration.py", "tests/engineering/test_scipy_supply.py"]
