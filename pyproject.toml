[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
[project]
name = "tobac-regulatory-research"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = ["numpy==2.3.5", "scipy==1.17.0"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
