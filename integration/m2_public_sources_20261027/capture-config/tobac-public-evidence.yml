name: tobac-public-evidence
description: Bounded public-source acquisition for M2 source mapping; local preservation only.
enabled: true
adapters:
- web
schedule: manual
rights_class: source_specific_review_required
output_preservation_policy:
  format: warc_and_manifest
  compression: none
  cas_hash_algorithm: sha256
  retention: permanent_subject_to_rights_review
publication_policy:
  huggingface:
    enabled: false
  zenodo:
    enabled: false
targets:
- https://www.treasury.govt.nz/sites/default/files/2025-07/oia-20250377.pdf
- https://www.customs.govt.nz/media/up4pimtv/oia-25-395-_.pdf
- https://www.health.govt.nz/system/files/2021-12/ris-smokefree-aotearoa-action-plan-mar24.pdf
- https://www.health.govt.nz/system/files/2023-10/report-on-illicit-tobacco-trade-baseline-report-oct23.v3.pdf
- https://www.health.govt.nz/system/files/2023-12/cabinet_material_establishing_the_smoked_tobacco_regulatory_regime_black_box_watermarked.pdf
- https://www.health.govt.nz/system/files/2024-02/options_to_repeal_amendments_to_smokefree_env_.act_assoc_regs_black_box_pr.pdf
- https://academic.oup.com/ntr/article/28/8/1357/8494659
